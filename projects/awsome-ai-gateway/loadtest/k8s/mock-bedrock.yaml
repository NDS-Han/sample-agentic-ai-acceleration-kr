# mock-bedrock — 부하테스트 전용 Bedrock Runtime mock.
#
# gateway-proxy 가 AWS_ENDPOINT_URL_BEDROCK_RUNTIME env 로 이 서비스를
# 향하도록 배선한다 (botocore env 오버라이드 — in-account + cross-account
# 클라이언트 모두 적용). 실 AWS 호출이 발생하지 않아 비용 $0.
#
# 배포:
#   kubectl apply -f loadtest/k8s/mock-bedrock.yaml
# 제거:
#   kubectl delete -f loadtest/k8s/mock-bedrock.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: loadtest-mock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-bedrock
  namespace: loadtest-mock
  labels:
    app: mock-bedrock
spec:
  # mock 은 async 서버라 단일 레플리카로 수천 홀딩 스트림을 감당한다 —
  # 병목은 게이트웨이 쪽이어야 하므로 mock 이 먼저 포화되지 않게 메모리는 넉넉히.
  replicas: 2
  selector:
    matchLabels:
      app: mock-bedrock
  template:
    metadata:
      labels:
        app: mock-bedrock
    spec:
      containers:
        - name: mock-bedrock
          image: MOCK_BEDROCK_IMAGE   # ECR 에 빌드·푸시한 이미지로 치환
          ports:
            - containerPort: 8080
          env:
            # Anthropic 청크 수/간격 — think/hold 시나리오는 model_id 로 제어
            - name: MOCK_CHUNKS
              value: "100"
            - name: MOCK_INTERVAL
              value: "0.05"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-bedrock
  namespace: loadtest-mock
spec:
  selector:
    app: mock-bedrock
  ports:
    - port: 8080
      targetPort: 8080
