[project]
name = "cost-recorder-worker"
version = "0.1.0"
description = "LLM Gateway — Cost Recorder Worker (Redis Stream → DB batch flusher + daily aggregator)"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ⚠️ pythonpath 는 load-bearing 이다. 이게 없으면 pytest 는 venv 에 editable 설치된
# 패키지를 import 한다 — 그 경로는 venv 를 만든 **그때의** 소스 트리이고, 체크아웃한
# 다른 트리(릴리스 태그, git worktree, 배포용 사본)에서 `pytest` 를 돌리면 **테스트만
# 그 트리 것이고 코드는 다른 트리 것**이 된다. 실측으로 그 상태에 빠졌다: 한 트리에서
# 소스를 고치고 다른 트리에서 스위트를 돌려 "672 통과" 를 받았는데, 고친 코드는 한 줄도
# 실행되지 않았다. admin-api 는 처음부터 이 줄이 있어서 무사했다.
pythonpath = ["src"]
markers = [
    "unit: fast unit tests with mocks (no DB/Redis required)",
    "integration: integration tests requiring Postgres + Redis",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
