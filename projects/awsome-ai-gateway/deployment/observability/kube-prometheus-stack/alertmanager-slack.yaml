# ============================================================================
# Alertmanager Slack 전달 — values 오버레이 (install.sh 가 Secret 확인 후에만 추가)
# ----------------------------------------------------------------------------
# Webhook URL 은 여기에도 values.yaml 에도 없다. install.sh 가
#   --set alertmanager.alertmanagerSpec.volumes[0].secret.secretName=alertmanager-slack-<env>
# 로 env 별 Secret 을 파드에 마운트하고, Alertmanager 는 api_url_file 로 파일을 읽는다.
# Secret 이 없으면 install.sh 는 이 파일을 넘기지 않는다 → 모든 알림이 "null"(전달 꺼짐),
# Alertmanager·Prometheus·규칙은 그대로 배포된다.
#
# 이 파일은 route·receivers 를 통째로 다시 쓴다(helm 은 리스트를 병합하지 않는다).
# values.yaml 의 route 를 바꾸면 여기도 맞춘다.
# ============================================================================
alertmanager:
  alertmanagerSpec:
    # volumes 는 install.sh 가 --set 으로 넣는다(Secret 이름이 env 별이라). optional=true —
    # Secret 이 나중에 지워져도 파드는 뜬다(그때는 Slack 전송 오류가 Alertmanager 로그/지표에 남음).
    volumeMounts:
      - name: slack-webhook
        mountPath: /etc/alertmanager/slack
        readOnly: true
  config:
    route:
      receiver: slack
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
        # info 등급(차트 기본 CPUThrottlingHigh 등)은 Slack 으로 보내지 않는다 — UI 에서만 본다.
        - receiver: "null"
          matchers: ['severity =~ "info|none"']
        - receiver: slack
          matchers: ['severity = "critical"']
          repeat_interval: 4h
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/slack/api_url
            send_resolved: true
            title: '{{ template "gw.slack.title" . }}'
            text: '{{ template "gw.slack.text" . }}'
