# ============================================================================
# kube-prometheus-stack — Loadtest observability
# ----------------------------------------------------------------------------
# Release name: kps (fullnameOverride 로 고정 — Grafana ServiceAccount 이름이
#               정확히 "kps-grafana" 가 되어 IRSA namespace_service_accounts 와
#               일치해야 함)
# ============================================================================
fullnameOverride: kps

# ─── Disabled components ─────────────────────────────────────────────────
# Fargate 미지원 or 부하테스트 불필요
nodeExporter:
  enabled: false

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

# ─── EKS 관리형 컨트롤 플레인 — 긁을 수 없어 *Down 알림이 상시 firing ──────
# EKS 는 controller-manager / scheduler / etcd 를 노출하지 않고, Fargate 에는
# kube-proxy DaemonSet 이 없다. 끄면 해당 ServiceMonitor 와 기본 알림 규칙
# (KubeControllerManagerDown, KubeSchedulerDown, KubeProxyDown, etcd*)이 같이 빠진다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  disabled:
    # Fargate kubelet 과 API 서버의 패치 버전이 다른 것이 EKS 의 정상 상태 — 상시 firing.
    KubeVersionMismatch: true

# ─── Alertmanager — Slack 만 구현된 수신자 ───────────────────────────────
# 이 파일은 **전달 꺼짐** 기본 설정이다(모든 알림 → "null"). Slack 전달은
# install.sh 가 env 별 Secret(alertmanager-slack-<env>, key api_url)을 찾았을 때만
# alertmanager-slack.yaml 을 덧씌워 켠다. Webhook URL 은 git·values 어디에도 없다 —
# 파드가 Secret 을 파일로 마운트하고 Alertmanager 가 api_url_file 로 읽는다.
# 다른 수신자(Teams, webhook, PagerDuty, …)는 docs/NDS/alerting-receivers.md 의 예시.
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1           # dev/prod 공통 1 파드. prod HA(2+, gossip)는 REPORT 의 sizing 메모
    storage: {}           # emptyDir — Fargate 에 EBS CSI 없음. 재시작 시 silence·알림 로그 소실
    retention: 120h
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
    receivers:
      - name: "null"
    # 차트 기본 억제 규칙 4개 + 워커 부재 시 그 워커의 파생 알림 억제.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ["namespace", "alertname"]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ["namespace", "alertname"]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ["namespace"]
      - target_matchers: ['alertname = InfoInhibitor']
      - source_matchers: ['alertname = CostWorkerMetricsAbsent']
        target_matchers: ['service = cost-recorder-worker', 'alertname != CostWorkerMetricsAbsent']
    templates:
      - "/etc/alertmanager/config/*.tmpl"
  # Slack 메시지 형식 — Slack 모드에서만 쓰인다(전달 꺼짐 모드에서는 로드만 됨).
  # env 는 Prometheus externalLabels.env(install.sh 가 --set)에서 온다.
  templateFiles:
    slack.tmpl: |-
      {{ define "gw.slack.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] [{{ or .CommonLabels.env "?" }}] {{ .CommonLabels.alertname }}
      {{- end }}
      {{ define "gw.slack.text" -}}
      {{ range .Alerts -}}
      *{{ .Labels.severity | toUpper }}* {{ .Annotations.summary }}
      {{ with .Annotations.description }}{{ . }}
      {{ end }}{{ range .Labels.SortedPairs }}{{ if and (ne .Name "alertname") (ne .Name "severity") (ne .Name "prometheus") }}`{{ .Name }}={{ .Value }}` {{ end }}{{ end }}
      {{ with .Annotations.runbook_url }}<{{ . }}|runbook> {{ end }}<{{ .GeneratorURL }}|query>
      {{ end -}}
      {{- end }}

prometheusOperator:
  # admissionWebhooks 를 전부 비활성화.
  # - enabled=false: ValidatingWebhookConfiguration/MutatingWebhookConfiguration
  #   리소스 생성 skip (operator pod 의 TLS secret mount 의존 제거).
  # - patch.enabled=false: TLS 주입 Job (Fargate 에서 불안정) skip.
  # 부하테스트 목적에선 PrometheusRule/ServiceMonitor validation 이 필수 아님.
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false        # operator 의 TLS 리스너도 비활성 (admissionWebhooks 와 쌍)
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ─── kube-state-metrics (HPA/Deployment state 메트릭) ────────────────────
kube-state-metrics:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ─── Prometheus ──────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 24h
    # OTel Collector 가 remote_write push → Prometheus 가 받도록 활성
    enableRemoteWriteReceiver: true

    # emptyDir — Fargate EBS CSI 없음. Pod 재시작 시 데이터 소실.
    # 테스트 종료 직전 export 스크립트로 S3 백업 필수.
    storageSpec: {}

    # Prometheus 가 전체 클러스터 ServiceMonitor 를 pick up
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Fargate 에서 tolerate 불필요 (Fargate profile 매칭으로 자동 스케줄)
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

# ─── Grafana ────────────────────────────────────────────────────────────
grafana:
  # admin password 는 admin-secret.sh 가 미리 생성한 Secret 참조
  admin:
    existingSecret: "kps-grafana-admin"
    userKey: admin-user
    passwordKey: admin-password

  # IRSA — install.sh 에서 GRAFANA_ROLE_ARN 으로 --set 주입
  serviceAccount:
    create: true
    name: kps-grafana
    annotations: {}   # install.sh 가 eks.amazonaws.com/role-arn 주입

  persistence:
    enabled: false    # emptyDir — dashboard JSON 은 manifests 로 provisioning

  defaultDashboardsTimezone: "Asia/Seoul"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Data sources — Prometheus(self) 와 CloudWatch(AWS)
  additionalDataSources:
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      uid: cloudwatch
      jsonData:
        authType: default      # IRSA 사용 (default credential chain)
        # defaultRegion 은 install.sh 가 --set 으로 주입한다 (values 파일에 리전을
        # 박으면 다른 리전 배포에서 조용히 틀린 리전을 조회한다 — dev/ap-south-1 실측).
        # 여기 남은 값은 apply 경로 없이 쓰인 경우의 폴백.
        defaultRegion: ap-northeast-2
        customMetricsNamespaces: "AWS/Bedrock,AWS/RDS,AWS/ApplicationELB"

  # 부하테스트 대시보드 provisioning (sidecar 방식)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: observability
      # pod 내 파일시스템 경로 — grafana 차트가 이 값을 volumeMount mountPath 와
      # sidecar FOLDER, provider options.path 세 곳에 그대로 쓴다. "Load Test"
      # 같은 이름을 두면 상대경로 mountPath 가 되어 sidecar 가 파일을 쓸 곳이
      # 없어 "insufficient privileges to create" 로 전부 skip 된다 (R31 실측).
      # UI 폴더명은 provider folder 필드가 결정 — 파일 경로와 무관하다.
      folder: "/tmp/dashboards"
