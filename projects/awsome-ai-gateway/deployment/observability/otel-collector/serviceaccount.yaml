apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  # IRSA 필요 없음 — OTel Collector 는 클러스터 내부 Prometheus 로 remote_write
---
# k8sattributes 프로세서가 송신 podIP 로 파드 메타데이터를 역조회하는 데 필요.
# 읽기 전용 pod 메타데이터 — 시크릿/스펙 쓰기 권한 없음.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8sattributes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
