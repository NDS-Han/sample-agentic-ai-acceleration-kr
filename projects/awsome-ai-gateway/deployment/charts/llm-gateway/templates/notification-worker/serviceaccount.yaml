{{- if and .Values.notificationWorker.enabled .Values.notificationWorker.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-gateway.serviceAccountName" (dict "root" . "svc" .Values.notificationWorker "default" "notification-worker") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.componentLabels" (dict "root" . "component" "notification-worker") | nindent 4 }}
  {{- with .Values.notificationWorker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/* R24-N2: IRSA(role-arn 어노테이션)가 있을 때만 SA 토큰을 마운트한다 —
    provider=mock/smtp/internal_api 는 AWS 권한이 없어 마운트가 탈취 면이다. */}}
automountServiceAccountToken: {{ ne (index (.Values.notificationWorker.serviceAccount.annotations | default dict) "eks.amazonaws.com/role-arn" | default "") "" }}
{{- end }}
