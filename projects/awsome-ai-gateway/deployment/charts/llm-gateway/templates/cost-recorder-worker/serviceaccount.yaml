{{- if and .Values.costRecorderWorker.enabled .Values.costRecorderWorker.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-gateway.serviceAccountName" (dict "root" . "svc" .Values.costRecorderWorker "default" "cost-recorder-worker") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.componentLabels" (dict "root" . "component" "cost-recorder-worker") | nindent 4 }}
  {{- with .Values.costRecorderWorker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/* R24-N2: 이 서비스는 k8s API 를 호출하지 않고 IRSA 도 안 쓴다 — SA 토큰 마운트는 탈취 면만 넓힌다. */}}
automountServiceAccountToken: false
{{- end }}
