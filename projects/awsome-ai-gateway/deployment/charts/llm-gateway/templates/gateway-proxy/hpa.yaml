{{- if and .Values.gatewayProxy.enabled .Values.gatewayProxy.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "llm-gateway.fullname" . }}-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.componentLabels" (dict "root" . "component" "gateway-proxy") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "llm-gateway.fullname" . }}-gateway-proxy
  minReplicas: {{ .Values.gatewayProxy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gatewayProxy.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.gatewayProxy.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gatewayProxy.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.gatewayProxy.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.gatewayProxy.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if hasKey .Values.gatewayProxy.autoscaling "executorInflightTarget" }}
    {{- $raw := .Values.gatewayProxy.autoscaling.executorInflightTarget }}
    {{- if or (not $raw) (le (float64 $raw) 0.0) }}
    {{- fail (printf "gatewayProxy.autoscaling.executorInflightTarget=%v — 양수여야 한다 (비어있거나 0 이하이면 HPA API 가 거절한다. 끄려면 키 자체를 지운다)" $raw) }}
    {{- end }}
    {{- $t := float64 $raw }}
    {{- if eq .Values.observability.otel.mode "sidecar" }}
    {{- fail "executorInflightTarget 은 in-cluster otel-collector 의 k8sattributes 전제 — sidecar 모드는 -otel-sidecar-config ConfigMap 이 차트에 없어 pod 레이블이 안 붙는다" }}
    {{- end }}
    # claude-code SSE 1개 = bedrock 스레드 슬롯 1개 — 블로킹 대기라 CPU 가
    # 안 올라 Resource 메트릭이 포화를 못 본다. prometheus-adapter 의
    # custom 규칙이 서빙하는 per-pod **최대 워커** inflight 로 스케일한다:
    # uvicorn 워커별 시리즈(service.instance.id) 중 가장 뜨거운 워커 —
    # 워커별 풀(BEDROCK_THREAD_POOL_SIZE, 기본 128) 포화가 진짜 한계라서
    # 파드 합계는 워커간 불균등 분배를 평균으로 숨길 수 있다.
    # 타깃 ≈ 워커당 풀의 70% 전후 (128 이면 ~90). 풀을 키우면 타깃도 같이.
    # type: Pods — pod 리소스 연동 메트릭(custom.metrics.k8s.io)으로
    # 파드당 평균. External 은 external.metrics.k8s.io 별도 API+규칙이
    # 필요해 adapter rules.external 을 또 만들어야 한다 — Pods 가 배선 반쪽.
    # 전제: observability/prometheus-adapter values.yaml 의 rules.custom +
    #       otel-collector k8sattributes (in-cluster 모드).
    - type: Pods
      pods:
        metric:
          name: gateway_bedrock_executor_inflight
        target:
          type: AverageValue
          averageValue: {{ $t | quote }}
    {{- end }}
  # SSE 스트림 연결이 붙어 있어서 스케일 다운을 보수적으로
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
{{- end }}
