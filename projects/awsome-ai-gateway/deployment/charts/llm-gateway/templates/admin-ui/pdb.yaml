{{- $minAvail := int (.Values.adminUi.podDisruptionBudget.minAvailable | default 1) -}}
{{- if and .Values.adminUi.enabled .Values.adminUi.podDisruptionBudget.enabled
      (ternary (gt (int .Values.adminUi.autoscaling.minReplicas) $minAvail)
               (gt (int .Values.adminUi.replicaCount) $minAvail)
               .Values.adminUi.autoscaling.enabled) -}}
{{/* R24-S2: 정적 1레플리카(autoscaling.minReplicas<=1 포함)에 minAvailable PDB 를
   렌더하면 허용 중단이 항상 0 이라 노드 패치/drain/eviction 이 영구 차단된다. */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llm-gateway.fullname" . }}-admin-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.componentLabels" (dict "root" . "component" "admin-ui") | nindent 4 }}
spec:
  minAvailable: {{ .Values.adminUi.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "llm-gateway.selectorLabels" (dict "root" . "component" "admin-ui") | nindent 6 }}
{{- end }}
