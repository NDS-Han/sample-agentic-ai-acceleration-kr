# ============================================================================
# AWS EKS Fargate — Production 환경 오버라이드
# ----------------------------------------------------------------------------
# 용도: 실제 사용자 트래픽, 10,000명 규모
# 특성: HA (3+ replica), Aurora cluster(다중 AZ), ElastiCache cluster mode
# ----------------------------------------------------------------------------
#    현재 파일은 "prod 인프라 회로(3 AZ/r7g/Aurora HA/ElastiCache Cluster mode/
#    3+ replica HPA)" 부하 테스트 목적의 smoke 설정임. 고객 고유 영역은 dev와
#    동일하게 내려둠:
#    - Ingress: HTTPS/ACM/WAF/도메인 대신 HTTP + host="" (방식 A)
#    - OTel: sidecar → in-cluster (Chart sidecar ConfigMap 템플릿 미완성)
#    - DEV_LOGIN_ENABLED: false (서명검증 없는 우회 경로 — prod 상시 차단, Cognito OIDC 사용)
#    - notificationWorkerUser: "gateway" (별도 DB role 생성 회피)
#    ACM ARN / 도메인 / SSO / DB role 정책에 맞춰 재설정할 것.
# ============================================================================

global:
  environment: prod
  deploymentMode: eks-fargate
  commonLabels:
    environment: prod
    managed-by: terraform
    cost-center: platform-ai
  # CHANGE_ME (account): 본인 AWS 계정의 ECR registry. terraform output ecr_registry 또는
  # `aws ecr describe-repositories --query 'repositories[0].repositoryUri' | cut -d/ -f1` 로 확인.
  imageRegistry: "123456789012.dkr.ecr.ap-northeast-2.amazonaws.com"

database:
  enabled: false
  external:
    # CHANGE_ME (terraform output): RDS Proxy endpoint. terraform output -raw rds_proxy_endpoint
    host: "llm-gateway-prod.proxy-xxx.ap-northeast-2.rds.amazonaws.com"
    port: 5432
    name: "gateway"
    user: "gateway"
    # migration Job 이 자동 생성/GRANT 하는 단일 'gateway' 유저 사용.
    # 필요시 "notification_worker_user" 별도 role 로 최소 권한 분리.
    notificationWorkerUser: "gateway"
    passwordSecretName: "llm-gateway-db"
    sslMode: "require"
    # migration Job 의 master 비번을 RDS 관리형 시크릿에서 **직접** 가져온다.
    # 왜: 수동 /llm-gateway/prod/db:master_password 에 값을 복사해 두는 방식은 관리형
    # 시크릿이 7일마다 자동 로테이션되므로(RotationEnabled=true) 반드시 어긋난다 —
    # 실제로 prod 는 이 드리프트로 두 값이 달라져 있었고(해시 e7e439f6a264 vs
    # 46079b8a29f3) 그 상태로 helm upgrade 하면 마이그레이션 Job 이 인증 실패한다.
    # dev 에서 수동 값을 고의로 오염시킨 음성 대조군으로 이 경로의 드리프트 내성을
    # 증명했다(rev83 통과). 이름은 describe-db-clusters 의 MasterUserSecret.SecretArn.
    # ⚠️ external-secrets IRSA 정책에 secret:rds!cluster-* 읽기 권한이 필요
    #    (terraform modules/irsa/main.tf 에 이미 선언 — 라이브 정책 v2 로 반영).
    masterPasswordRemoteKey: "rds!cluster-6516eb93-cacb-4a6d-8cbe-f7823369881c"
    masterPasswordRemoteProperty: "password"
    # pod 당 pool 50 (base 20 + burst 30). Aurora r7g.large max_connections ≈ 1800.
    # HPA max 30 × 50 = 1,500 → 한도의 83% 안전. RDS Proxy multiplex 로 실제는 더 여유.
    # VK 조회는 Redis cache hit 가 주경로라 실제 사용량은 100 내외.
    poolSize: 20
    maxOverflow: 30
    # prod 는 RDS Proxy 경유(enable_rds_proxy=true 기본값)이므로
    # asyncpg prepared statement 캐시 비활성 필수 (PostgreSQL pinning 회피).
    # Proxy 를 끄는 경우엔 100 으로 복구.
    statementCacheSize: 0

redis:
  enabled: false
  # 명시(상속 아님): pod 당 pool × HPA maxReplicas(30) ≤ 노드 maxclients 합.
  # 30 × 150 = 4,500 (3-shard 기준 shard 당 ~1,500). deepdive Q50 Phase4.
  # ⚠️ loadtest(80~100 pod)는 values-*-prod-loadtest.yaml 에서 더 낮게 override.
  poolSize: 150
  external:
    # CHANGE_ME (terraform output): ElastiCache configuration endpoint (cluster mode).
    # terraform output -raw elasticache_configuration_endpoint
    host: "clustercfg.llm-gateway-prod.xxx.apn2.cache.amazonaws.com"
    port: 6379
    tls: true
    clusterMode: true
    # ElastiCache AUTH — /llm-gateway/prod/redis Secrets Manager 에서 동기화.
    # 빈 값이면 ExternalSecret 생성 안 되어 모든 Redis 클라이언트가 Auth 실패.
    passwordSecretName: "llm-gateway-redis"
    passwordSecretKey: "password"

aws:
  region: "ap-northeast-2"
  # 코드가 읽지 않는 값(configmap 이 BEDROCK_ALLOWED_MODELS 로 내보내지만 소비처 없음).
  # 실제 모델 제어는 DB model_aliases + IAM bedrock_allowed_model_arns(tfvars).
  # 옛 서울 모델 목록이 혼란을 줘서 비움. 훅 자체는 base values 에 남겨둠.
  bedrockAllowedModels: []
  allowedStsRegions:
    - "ap-northeast-2"
  allowedIamRoles:
    # 임의로 생성한 IamRoles, 고객에 맞게 변경 필요
    - Customer-Developer
    - Customer-Engineer
    - Customer-Admin
    - admin

externalSecrets:
  enabled: true
  secretStoreRef:
    kind: "ClusterSecretStore"
    name: "aws-secrets-manager"
  secretPathPrefix: "/llm-gateway/"
  refreshInterval: "30m"

# Ingress — 테스트용 방식 A (HTTP, 도메인 없음)
# 고객 상황에 맞게 설정 필요
#   annotations:
#     alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
#     alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
#     alb.ingress.kubernetes.io/ssl-redirect: "443"
#     alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:...CHANGE_ME"
#     alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:...CHANGE_ME"
#   gateway/adminUi/adminApi: host=실제 도메인, tls.enabled=true
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip  # Fargate 필수
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # SSE 스트리밍을 위해 idle timeout 충분히 (dev 300s → prod 600s 유지)
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
  # host 를 비워두면 ALB 가 모든 Host 헤더를 수락 (ALB DNS 로 직접 접근 가능)
  gateway:
    host: ""
    tls:
      enabled: false
  adminUi:
    host: ""
    tls:
      enabled: false
    # 최종형(고객 권장): admin 을 private 서브넷 internal ALB 로 — 아래 2줄 해제.
    # 전제 S2S VPN. 상세: docs/us-llm-gateway/architecture.md 「고객사 최종 아키텍처」
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internal
  adminApi:
    host: ""
    tls:
      enabled: false
    # 최종형(고객 권장): 위 adminUi 와 동일 — 아래 2줄 해제 (gateway 는 public 유지)
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internal

observability:
  otel:
    # sidecar 모드는 Chart에 ConfigMap 템플릿이 아직 없어서 Pod 가 ContainerCreating
    # 에서 영구 대기. OTel Collector 배포 전에는 in-cluster + dummy endpoint 로 두고,
    # Collector 배포 시점에 endpoint 만 교체 (env only, Pod 재시작 불필요).
    mode: "in-cluster"
    endpoint: "otel-collector.observability.svc.cluster.local:4317"
    protocol: "grpc"

# ============================================================================
# 서비스별 — Production HA
# ============================================================================
gatewayProxy:
  replicaCount: 3
  image:
    # ⚠️ 태그 필수 명시 — 비우면 Chart.appVersion(1.0.43)로 폴백. chart의 readinessProbe(/health/ready)는
    # 1.0.51-resilience 이상에서만 200 응답(구버전은 401) → 반드시 resilience 이미지와 정합 유지.
    # 1.0.52-workers: CMD ${WORKERS:-4} 로 WORKERS env 활성화(0.5 vCPU 4워커 기아 → 2워커).
    # 1.0.53-streamfix: stream_idle_timeout / stream_disconnect_drain_timeout 배선(그전엔
    #   config 에만 있고 streaming.py 가 읽지 않는 죽은 설정) + 타임아웃·예외 경로에서
    #   usage/billing 이 유실되던 것을 usage_fired 멱등 가드로 수정(A-1). 330 유닛 통과.
    # 1.0.54-phase2gw: 레포 HEAD 의 gateway-proxy 미배포분 6파일 반영(dev 와 동일 이미지).
    #   ⚠️ prod 행동 델타는 **로깅 추가뿐**임을 실측 확인: ① mantle_adapter /
    #   mantle_openai_adapter 는 비200 warning 에 error_body(500B) 추가 = 응답경로 무변경,
    #   ② web_search_loop · agentcore_mcp_client 변경은 prod 에서 도달 불가
    #   (prod pod 실측 agentcore_gateway_url='' → mcp_client None,
    #    기동로그 agentcore_mcp_client_configured 0건),
    #   ③ thinking_normalizer / tool_filter 신규 2개는 레포 전체에 호출처 0(미배선).
    # 1.0.55-runtimeplane: GPT-5.6 을 표준 bedrock-runtime plane 으로도 서비스
    #   (sigv4_signer / bedrock_openai_adapter / openai_usage 신규 3파일 + provider enum
    #   BEDROCK_RUNTIME_OPENAI 미러). Mantle 경로는 건드리지 않는다 — 같은 방언, 다른 plane.
    #   ⚠️ 이 이미지는 provider enum 5라벨을 알아야 하므로 **migration(0031/0032)보다 먼저**
    #   떠 있어야 한다. 그래서 2단계 배포: 이 태그 먼저 → 그다음 migration 태그.
    # 1.0.56-wsresiduals: web search 루프 잔여 결함 3건 수정(upstream fix/websearch-residuals 4261967 cherry-pick)
    #   — 검색+클라이언트 도구 동시 호출 턴에서 클라이언트 도구 호출 삼킴 · 응답에 web_search tool_use 누출
    #   (다음 턴 Bedrock "Tool web_search not found" 400) · message_start 없는 종료 프레임. 2026-09-15 US Cowork 실측.
    # 1.0.57-wsdesc: web_search 도구 설명에 절제 지시 추가(dev 주석 참조).
    # 1.0.58-wsfinal: force_final 턴 400 수정 — 이력에 새어 있던 web_search 블록을 이름으로 걷어내고,
    #   비스트리밍 루프 2개도 force_final 에서 걷어낸다(2026-09-16 실측: 상한을 낮추자 Cowork 재시도 3회가 전부 400).
    # 1.0.59-outcfg: Cowork 의 output_config.format(구조화 출력)을 Bedrock 이 거부(400) → effort 만 남기고 걷어냄.
    # 1.0.60-ctxusage: 클라이언트 usage 의 입력·캐시 버킷을 검색 N턴 합계가 아니라 첫 턴 값으로 → Cowork 자동 압축 thrashing 해소(청구는 불변).
    # 1.0.61→1.0.63-wstrace: 검색마다 흔적 한 줄(+상위 제목 2개·"결과 전문 제공됨" 안내, 모델이 모방한 흔적 줄은 필터)(🔎 [gateway web_search] …)을 응답 텍스트로 남김 → 클라이언트 도구 사이 다음 요청에서 모델이 "검색한 적 없다" 며 되풀이하던 루프 방지.
    # 1.0.64-toolchoice: 클라이언트가 web_search 를 tool_choice 로 강제하면(Cowork 내장 WebSearch 헬퍼) 첫 턴만 존중, 이후 auto, 최종 턴은 제거 → 400 루프 해소.
    # 1.0.65-wsopt: (A) 검색 결과 tool_result 에 cache_control 1개(뒤 턴 캐시 읽기, 4개 한도, WEB_SEARCH_CACHE_RESULTS=false 로 끔) (H) 결과 항목별 본문 1500자 트림(WEB_SEARCH_RESULT_TEXT_CHARS) (O) 턴당 검색 동시 실행 + 흔적 줄 간소화(WEB_SEARCH_TRACE_LANG=ko 옵션).
    # 1.0.66-ffnote: 최종(도구 제거) 턴에서 thinking 만 남는 assistant 턴에 안내 문구, 마지막 user 메시지에 "이제 답하라" 지시 → Opus 5 가 `<br>` 만 내던 빈 답 방지.
    # 1.0.67-balance: 품질 우선 균형 — 상한 초과 문구 "실행 안 됨, 다음 턴 재요청", 도구 설명에 검색 예산 명시, 첫 턴 연결 오류 1회 재시도, 마지막 라운드 캐시 표시 생략. 상한은 턴당 3 x 2턴(최대 6, 동일).
    # 1.0.68-ffnone: Anthropic 최종(force_final) 턴을 "도구 유지 + tool_choice none + 답하라 지시" 로 — 이력 변환 없이 캐시 접두 보존, 빈 답 원인 제거. 마지막 라운드 캐시 표시 복원.
    # 1.0.69-nudge: 도구 설명 — 이력의 🔎 줄은 게이트웨이가 넣은 진짜 검색 기록(폐기 금지). 최종 턴이 thinking 만 내고 본문이 없으면 한 번만 재촉.
    # 1.0.70-native: 탐침 — 검색 흔적을 🔎 텍스트 줄 대신 Anthropic 네이티브 블록(server_tool_use + web_search_tool_result, 발췌는 encrypted_content)으로. WEB_SEARCH_TRACE_MODE=native + anthropic-client-platform 허용 목록(기본 desktop_app=Cowork)일 때만, 기본 text 는 종전과 동일. 되돌아온 블록은 텍스트로 환원·카운트 로그. 덤: 섞인 턴에서 버려지는 검색에 "not run" 흔적, 도구 설명에 "회사별로 나눠 검색".
    # 1.0.71-nativegate: 1.0.70 게이트 수정 — 실제 Cowork 는 anthropic-client-platform 헤더가 아니라 User-Agent 로 식별되므로(탐침 실측: 검색 4회에 native 0회) 미들웨어가 분류한 클라이언트(WEB_SEARCH_TRACE_NATIVE_CLIENTS, 기본 cowork)로 판정.
    # 1.0.72-nativehist: 본 구현 — Cowork 가 되돌려 준 native 검색 블록(탐침 07:57 inbound 2/2·4/4 확인)을 루프 턴에서 tool_use/tool_result 로 재작성해 결과 발췌(digest)까지 모델에 다시 보인다(탐침은 결과 없는 텍스트 한 줄이라 답이 흐려짐). 우리 도구 없이 나가는 경로(폴백 루프·Mantle·count_tokens·MCP 실패 폴백)는 텍스트 환원 유지.
    # 1.0.73-nativeshow: native 모드에서도 🔎 표시 줄을 블록 뒤에 함께 낸다(Cowork 화면은 블록을 그리지 않아 검색 흔적이 안 보였음). 되돌아오면 재작성 때 🔎 줄은 걷어내 모델 이력에는 도구 기록만 남는다(모방 원천 없음).
    # 1.0.74-digest: 되돌아온 검색 결과의 발췌를 200자·페이지 첫머리 → 본문다운 지점부터 600자(WEB_SEARCH_DIGEST_CHARS)로. 모델이 본 트림 결과에서 만들고, 되살린 tool_result 에 "전문은 그 턴에 봤다" 메모 — Cowork 2번 프롬프트에서 발췌가 얇아 실제 근거를 되물리던 문제.
    # 1.0.75-digestfull: 되돌아온 결과 발췌 기본을 "모델이 본 트림 결과와 같은 길이"(1500)로. 600자에서도 실제 근거 문장(마이크론 3월 HVM·TrendForce 20%)이 잘려 모델이 되물렸음(S3 전문 확인). WEB_SEARCH_DIGEST_CHARS(17 스크립트 키, 0=동일)로 줄일 수 있음. 품질 우선(사용자 결정).
    # 1.0.76-evidence: 검색 1회 = 증거 집합 하나(모델 tool_result·되돌림·🔎 줄이 같은 집합). 상한(WEB_SEARCH_MAX_RESULTS_DEFAULT)을 "최대"로 강제(모델이 15 를 요구해 12k 캡에서 JSON 이 매 검색 절단되던 문제 — S3 실측), 미러·중복 제거(본문 지문), 결과당 길이를 캡에 맞춰 배분(절단 불가), 잡음 배지("3 min read") 제거. 커넥터엔 상한의 2배까지 요청(과금 호출당).
    # 1.0.77-finalnotool: 강제 최종 턴 지시문이 "어떤 도구도 호출할 수 없다, 다음 단계를 예고하지 말고 지금 완전한 답을 써라" 를 말하도록 — tool_choice none 은 클라이언트 도구까지 막는데 종전 문구는 "검색 불가"만 알려, 모델이 "메모 저장 후 작성" 을 예고만 하고 턴을 끝냄(2026-09-18 Cowork: 텍스트 191자, 답 없음).
    # 1.0.78-clienttools: 검색과 클라이언트 자체 도구의 공존(둘 다 env 스위치, 기본 off = 종전 동작) — WEB_SEARCH_MIXED_TURN_RUN=1: 한 턴에 클라이언트 도구와 web_search 를 같이 부르면 검색도 실행해 같은 메시지에 native 블록으로 싣는다(종전: 흔적 없이 버려 모델이 재요청 — Cowork 실측 10건 중 5건 유실). WEB_SEARCH_FINAL_TURN_SOFT=1: 검색 예산 소진 뒤에도 클라이언트 도구는 호출 가능, 추가 검색만 max_uses_exceeded 오류로 거절 후 hard final(종전: tool_choice none 이 Write 까지 막아 "검색해서 파일 저장" 이 저장 없이 끝남).
    # 1.0.79-advisorstrip: Anthropic 전용 서버 도구를 Bedrock 으로 보내기 전에 제거 — Claude Code 의 advisor 가 켜진 세션은 모든 요청에 {"type":"advisor_20260301"} 를 실어 보내고 Bedrock 이 요청 전체를 400 으로 거절("hi" 도 실패, 2026-09-18 US). 접두어 목록은 BEDROCK_UNSUPPORTED_TOOL_TYPE_PREFIXES(기본 "advisor_", 빈 값 = 끔) — 새 Anthropic 전용 도구 타입은 재빌드 없이 설정으로 대응.
    tag: "1.0.79-advisorstrip"
  serviceAccount:
    annotations:
      # CHANGE_ME (terraform output): IRSA role ARN. terraform output -raw gateway_proxy_role_arn
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/llm-gateway-prod-gateway-proxy-bedrock"
  env:
    # uvicorn 워커 수. Dockerfile CMD 가 ${WORKERS:-4} 로 읽음(1.0.98+). cpu request
    # 500m(Fargate ≈0.5 vCPU)에서 4워커면 워커당 0.125 vCPU 기아 → /v1/messages p95 저하.
    # 2 = GIL 회피(멀티프로세스)와 CPU 기아 회피의 균형. burst 시 limit 2 vCPU 여유.
    # (과거엔 Dockerfile 하드코딩 4 라 이 값이 죽은 설정이었음 — 부하테스트 p95 숨은 원인.)
    WORKERS: "2"
    # web search 비용 상한(2026-09-16 실측: 검색 4회 든 호출 1건 = 입력 132k 토큰·$1.56 — 검색 결과 본문이
    #   반복마다 다시 입력으로 들어간다). 결과 1회 60,000자(≈15k 토큰)→12,000자, 결과 수 10→5, 턴당 검색 4→2,
    #   반복 5→3. 게이트웨이 config.py 의 기본값을 여기서 덮어쓴다.
    WEB_SEARCH_MAX_RESULT_CHARS: "12000"
    WEB_SEARCH_MAX_RESULTS_DEFAULT: "5"
    WEB_SEARCH_MAX_SEARCHES_PER_TURN: "3"
    WEB_SEARCH_MAX_ITERATIONS: "2"
  # SSE 스트리밍 타임아웃. prod ALB idle_timeout=600s(:114) 보다 60s 아래로 둔다 —
  # 같거나 크면 ALB 가 먼저 끊어 클라이언트가 깔끔한 SSE 에러 대신 truncated stream 을
  # 본다. prod 는 dev(300s) 보다 ALB 상한이 크므로 idleTimeout 도 그만큼 여유를 준다
  # (extended thinking 이 긴 요청을 끊지 않도록). ALB 값 변경 시 함께 조정할 것.
  streaming:
    idleTimeout: 540
    disconnectDrainTimeout: 30
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: gateway-proxy
            topologyKey: topology.kubernetes.io/zone

adminApi:
  replicaCount: 3
  image:
    # ⚠️ 태그 필수 명시. 여기가 비어 있던 탓에 prod 는 Chart.appVersion(1.0.43-rebrand) 로
    # 폴백하도록 렌더되는데, 라이브는 `kubectl set image` 로 1.0.52-phase2fixes 가 올라가
    # **차트와 클러스터가 어긋난 상태**였다(managedFields: kubectl-set / 2026-07-20).
    # 그 상태에서 helm upgrade 를 돌리면 prod admin-api 가 한 달 전 이미지로 역행한다.
    # → 이제 명시해서 차트가 곧 진실이 되게 한다. `kubectl set image` 로 prod 를 바꾸지 말 것.
    # 1.0.65-kstfix: KST 기간 필터 non-sargable 제거(86.7ms→7.9ms, buffers 15,373→1,811) +
    #   생산성/Git 지표 UTC 비닝을 비용(KST)과 통일(A-2/E-1). 회귀 대조 신규 0.
    # 1.0.66-kstdefault: E-1 잔존 4곳(my/budget·my/usage·analytics/models·budgets team
    #   allocation)이 date.today()(=pod TZ UTC)로 기본 period 를 정해 매월 1일 KST
    #   00~09시에만 지난달 지표가 보이던 것 수정 → current_kst_period() 단일화(5개 라우터).
    #   + period 형식 오류를 400(ValidationError)으로. 회귀 대조 신규 0.
    # 1.0.67-roifix: ⚠️ 1.0.66 의 **스케줄러 회귀 수정** — 1.0.66 에 머무르지 말 것.
    #   roi_aggregator 의 헬퍼 import 가 aggregate_usage() 안에만 있고 호출은
    #   _aggregate_productivity() 에도 있어(함수 로컬 바인딩은 형제 함수에 안 미친다)
    #   ROI 집계가 15분마다 `NameError` 로 전부 실패했다 — prod/dev 라이브 로그로 실측.
    #   pod 는 Running, API 도 정상이라 겉으론 무증상이고 ROI 지표만 갱신이 멈춘다.
    #   유출 원인: 가드 테스트가 소스를 문자열 grep 해서 버그 상태에서도 통과했다
    #   → 이제 AST 로 "호출 지점에서 이름이 해석되나"를 본다(음성대조군으로 확인).
    #   함께 prod E2E 에서 실측된 2건: period='26-08'/'2026-8' 이 자리수 미검증으로 통과해
    #   **200 + 전부 0**(서기 26년 조회), '9999-12' 는 맨 ValueError 로 **500** →
    #   정규식 + 연범위(2000~2100) 검증으로 둘 다 400 통일.
    #   그리고 E-1 잔존 2곳: scheduler/main.py(ROI 행을 실제로 **쓰는** cron)·internal.py 가
    #   UTC 월이라, 읽는 쪽만 KST 인 상태면 매월 1일 KST 00~09시에 새 달 행이 아예 생성되지
    #   않아 지표 전체가 0 으로 보인다(한쪽만 고치면 더 나빠지는 경우).
    # 1.0.68-invlogaudit: Bedrock invocation log 본문 감사(/admin/audit/invocation-log/
    #   {config,reconcile,{bedrock_request_id}}) + provider enum BEDROCK_RUNTIME_OPENAI 미러.
    #   prod 는 BEDROCK_INVOCATION_LOG_GROUP 을 주지 않으므로 /config 는 200+configured:false,
    #   데이터 엔드포인트는 503 이다(라우터는 항상 등록되므로 404 아님).
    #   ⚠️ scheduler.image.tag 와 반드시 동일하게 — enum 미러 누락은 READ 에서 죽는다.
    tag: "1.0.68-invlogaudit"
  serviceAccount:
    annotations:
      # CHANGE_ME (terraform output): IRSA role ARN. terraform output -raw admin_api_role_arn
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/llm-gateway-prod-admin-api"
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "1500m"
      memory: "1.5Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  env:
    # 🔴 prod 에서는 반드시 "false".
    # core/auth.py 의 _parse_dev_token 은 `dev.<base64url payload>.sig` 토큰을
    # **서명 검증 없이** 파싱해 payload 의 role 을 그대로 신뢰한다. 이 값이 "true" 면
    # 누구든 role=ADMIN 을 담은 임의 토큰(또는 admin_jwt 쿠키)으로 control-plane 전체를
    # 관리자 권한으로 호출할 수 있다. prod 인그레스 3개가 모두 internet-facing 이므로
    # 켜두면 인터넷에서 도달 가능한 무인증 관리자 우회가 된다.
    # 관리자 로그인은 아래 oidc(Cognito) 경로를 쓴다 — 이미 enabled=true 이고
    # adminBootstrap.emails 가 첫 운영자를 ClaudeAdmin 으로 승격한다.
    DEV_LOGIN_ENABLED: "false"
    # CHANGE_ME (terraform output): Cognito User Pool ID. terraform output -raw cognito_user_pool_id
    COGNITO_USER_POOL_ID: "ap-northeast-2_oofmkaz81"
    COGNITO_REGION: "ap-northeast-2"
    COGNITO_SYNC_DEACTIVATE_MISSING: "true"

    # ── Bedrock invocation log 감사 대조 — prod 는 **끈 상태로 둔다** ──
    # 이 스위치는 리전 단위로 **계정 전체**의 요청/응답 본문을 CloudWatch 에 남긴다
    # (모델·principal 단위 스코프가 없다). prod 에서 켜면 게이트웨이를 지나는 모든
    # 사용자 프롬프트가 로그에 적재되므로, 개인정보/보존기간 승인 없이는 켜지 않는다.
    # 지금은 키 자체를 두지 않는다 — 코드 기본값이 빈 문자열이고, 감사 엔드포인트는
    # 503(미설정)을 반환한다(라우터는 등록돼 있으므로 404 가 아니다).
    #
    # 참고: prod terraform 루트에는 bedrock-invocation-logging 모듈을 **의도적으로 넣지
    # 않았다**(dev 루트에만 있다). 승인 후 켤 때 dev/main.tf 의 module 블록 +
    # providers.tf 의 aws.bedrock_openai 별칭 + outputs.tf 3개를 prod 루트로 복사하고
    # enable_bedrock_invocation_logging=true 로 apply 한 뒤, 그 output 값을 여기 적는다.
    # REGION 은 배포 리전이 아니라 모델 실행 리전이다(GPT-5.6 runtime plane = us-east-2).
    # BODIES_ENABLED 는 별개 승인 사항이다 — 켜면 열람마다 audit_logs 에
    # VIEW_INVOCATION_LOG_BODY 가 남는다.
    # BEDROCK_INVOCATION_LOG_GROUP: ""
    # BEDROCK_INVOCATION_LOG_REGION: "us-east-2"
    # BEDROCK_INVOCATION_LOG_BODIES_ENABLED: "false"

  # ── OIDC (Cognito) ──
  oidc:
    enabled: true
    # CHANGE_ME (terraform output): cognito_issuer_url. 형식 https://cognito-idp.{region}.amazonaws.com/{pool_id}
    issuerUrl: "https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_oofmkaz81"
    audience: ""               # Cognito access_token 은 aud 없음 → 비워둠
    providerName: "oidc:cognito"
    groupsClaim: "cognito:groups"
    groupPrefix: "Claude_"
    rejectUnmatchedGroups: true
    requiredGroup: ""
    vkTtlHours: 1

  adminBootstrap:
    # CHANGE_ME (org-specific): 첫 운영자 이메일. 이 사용자가 ClaudeAdmin 으로 승격됨.
    # 본 deliverable 의 prod 환경 운영자는 kyutae-ai@amazon.com.
    emails:
      - "kyutae-ai@amazon.com"
    groups:
      - "ClaudeAdmin"

adminUi:
  replicaCount: 2
  image:
    # ⚠️ 태그 필수 명시 — 비우면 Chart.appVersion(1.0.43-rebrand)로 폴백되어 다운그레이드됨.
    # install-eks.sh 는 image.tag 를 --set 으로 주입하지 않으므로 전적으로 이 값에 의존.
    # 1.0.99-modelform: ModelCreateSchema 의 max_tokens/context_window 제거 — 폼에 입력란이
    #   없고 백엔드·DB 에도 대응 필드가 없어 required 로 남으면 safeParse 가 항상 실패,
    #   모델 등록/편집이 100% 막히던 것 수정(modelfix 1.0.98·브랜드 1.0.97 포함).
    # 1.0.100-mwredirect: 미들웨어 로그인 리다이렉트가 상대 Location 이라 Next 14.2 어댑터에서
    #   Invalid URL → 미인증·만료 요청이 오는 모든 페이지 500 (upstream b51fab0 를 처음 빌드한 결과).
    #   요청 Host + x-forwarded-proto 로 절대 URL 을 만들도록 수정.
    tag: "1.0.100-mwredirect"
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  env:
    # admin-ui (Next.js) 의 dev-login route 렌더 스위치 (admin-api 와 별개 env).
    # prod 는 "false" — adminApi 쪽과 반드시 짝을 맞춘다. 한쪽만 내리면 UI 에 버튼은
    # 보이는데 API 가 401 을 주거나(또는 그 반대) 혼란만 남는다.
    DEV_LOGIN_ENABLED: "false"

scheduler:
  image:
    # ⚠️ 태그 필수 명시(그전엔 없어서 appVersion 1.0.43-rebrand 폴백 — prod 라이브도 실제로
    # 1.0.43-rebrand 로 돌고 있었다). admin-api 이미지를 공유하므로 **adminApi.image.tag 와
    # 항상 같은 값**으로 유지한다 — roi_aggregator 가 KST 비닝 수정(A-2/E-1) 대상이라
    # 어긋나면 API 는 새 로직, 스케줄러는 옛 로직으로 집계해 지표가 갈린다.
    # ⚠️ 1.0.67-roifix 는 특히 이 값이 핵심이다: 고쳐진 NameError 는 **스케줄러 프로세스에서만**
    # 터지는 경로라(API 는 그 함수를 타지 않는다) adminApi 만 올리면 ROI 집계는 계속 실패한다.
    # 1.0.68-invlogaudit: adminApi 와 동일 이미지. 이 값만 뒤처지면 스케줄러의 SQLAlchemy
    # provider enum 미러가 4라벨로 남아 0032 가 심은 BEDROCK_RUNTIME_OPENAI 행을 읽는 순간
    # LookupError 로 모델 카탈로그 조회 전체가 깨진다(조용히 실패하지 않고 크게 죽는다).
    tag: "1.0.68-invlogaudit"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

