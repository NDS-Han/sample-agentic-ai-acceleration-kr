# ============================================================================
# AWS EKS Fargate — Development 환경 오버라이드
# ----------------------------------------------------------------------------
# 용도: 기능 검증, 실제 Fargate/IRSA/Bedrock 연동 테스트
# 특성: 저비용(t-class Aurora), 단일 AZ 수용, 낮은 replica
# 사용법:
#   helm install llm-gateway ./charts/llm-gateway \
#     -f ./charts/llm-gateway/values-eks-fargate-dev.yaml \
#     -n llm-gateway-dev --create-namespace
# ============================================================================

global:
  environment: dev
  deploymentMode: eks-fargate
  # dev 환경에서만 허용 — admin-api·admin-ui 양쪽에 동시 주입됨(단일 스위치).
  # Cognito 로그인(adminApi.oidc/adminApi.adminUiLogin)이 준비되면 false 로.
  devLoginEnabled: true
  # CHANGE_ME (org): 리포팅 타임존 — 대시보드·일별 집계(daily_aggregates)·이메일 발송시각의
  # 달력 경계. **정규 IANA 이름만**(예: America/Los_Angeles · Asia/Seoul · UTC — "KST"/"PST"/
  # "US/Pacific" 은 배포 이미지에서 거부). fill-org-values.sh 가 프롬프트로 채운다.
  # 예산 강제(gateway-proxy)의 월 경계는 이 값과 무관하게 UTC 고정.
  reportingTimezone: "Asia/Seoul"
  commonLabels:
    environment: dev
    managed-by: terraform
  # CHANGE_ME (account): 본인 AWS 계정의 ECR registry. terraform output ecr_registry 또는
  # `aws ecr describe-repositories --query 'repositories[0].repositoryUri' | cut -d/ -f1` 로 확인.
  imageRegistry: "123456789012.dkr.ecr.ap-northeast-2.amazonaws.com"

# ----------------------------------------------------------------------------
# 외부 관리형 의존성 (Aurora / ElastiCache)
# ----------------------------------------------------------------------------
database:
  enabled: false  # 반드시 false — Aurora 사용
  external:
    # CHANGE_ME (terraform output): RDS Proxy endpoint. terraform output -raw rds_proxy_endpoint
    # (Proxy 사용 안 하면 -raw aurora_writer_endpoint). 계정마다 hash 부분 다름.
    host: "llm-gateway-dev.proxy-xxx.ap-northeast-2.rds.amazonaws.com"
    port: 5432
    name: "gateway"
    user: "gateway"
    # 모든 서비스가 단일 'gateway' 유저 사용 (migration Job 이 자동 생성/GRANT).
    # notification-worker 도 동일 유저 사용 — base values.yaml 의 통일 결정을 env 에서도 유지.
    notificationWorkerUser: "gateway"
    passwordSecretName: "llm-gateway-db"
    sslMode: "require"
    # migration Job 의 master 비번을 RDS 관리형 시크릿에서 **직접** 가져온다.
    # 수동 /llm-gateway/dev/db:master_password 를 복사해 두는 방식은 관리형 시크릿이
    # 7일마다 자동 로테이션되므로(RotationEnabled=true, AutomaticallyAfterDays=7)
    # 값 동기화가 끝없이 반복되는 트레드밀 — 실제로 prod 는 이 드리프트로 어긋나 있었다.
    # 이름은 aws rds describe-db-clusters --query 'DBClusters[].MasterUserSecret.SecretArn'.
    # ⚠️ external-secrets IRSA 정책에 secret:rds!cluster-* 읽기 권한이 필요
    #    (terraform modules/irsa/main.tf 에 이미 선언됨 — 라이브 정책 v2 로 반영).
    masterPasswordRemoteKey: "rds!cluster-91c56396-2163-4d82-af13-b569d4ea5c0e"
    masterPasswordRemoteProperty: "password"
    poolSize: 5
    maxOverflow: 10
    # dev 도 enable_rds_proxy=true 기본값이라 Proxy 경유 → pinning 회피 위해 0.
    # Proxy 끄려면(-var enable_rds_proxy=false) 100 으로 복구.
    statementCacheSize: 0

redis:
  enabled: false  # ElastiCache 사용
  # dev 는 단일 노드(cache.t4g.small)·HPA 1~3 pod → 풀을 작게(노드 커넥션 보호).
  # deepdive Q50 Phase4: pod 당 pool × maxReplica ≤ 노드 maxclients.
  poolSize: 40
  external:
    # CHANGE_ME (terraform output): ElastiCache primary endpoint. terraform output -raw elasticache_primary_endpoint.
    host: "master.llm-gateway-dev.xxx.apn2.cache.amazonaws.com"
    port: 6379
    tls: true  # ElastiCache encryption-in-transit
    clusterMode: false  # dev는 단일 노드
    # ElastiCache AUTH 토큰 — 03-secrets.md §3 에서 생성한 Secret 경로와 일치.
    # 빈 값이면 ExternalSecret 이 생성되지 않아 모든 Redis 클라이언트가 Auth 실패.
    passwordSecretName: "llm-gateway-redis"
    passwordSecretKey: "password"

# ----------------------------------------------------------------------------
# AWS / IAM — dev 계정/역할 예시 (Terraform outputs로 교체 필요)
# ----------------------------------------------------------------------------
aws:
  region: "ap-northeast-2"
  # 코드가 읽지 않는 값(configmap 이 BEDROCK_ALLOWED_MODELS 로 내보내지만 소비처 없음).
  # 실제 모델 제어는 DB model_aliases(§4) + IAM bedrock_allowed_model_arns(tfvars).
  # 옛 서울 모델 목록이 혼란을 줘서 비움. 훅 자체는 base values 에 남겨둠.
  bedrockAllowedModels: []
  allowedStsRegions:
    - "ap-northeast-2"
  allowedIamRoles:
    - Customer-Developer  # dev Permission Set 예시
    - admin                # 개발/테스트 계정 admin role

# ----------------------------------------------------------------------------
# Secrets — ExternalSecrets Operator 사용 (AWS Secrets Manager)
# ----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  secretStoreRef:
    kind: "ClusterSecretStore"
    name: "aws-secrets-manager"
  secretPathPrefix: "/llm-gateway/"
  refreshInterval: "1h"

# ============================================================================
# Ingress (ALB) — 방식 A(도메인 없음) / 방식 B(도메인 있음) 택 1
# ----------------------------------------------------------------------------
# ■ 방식 A — 도메인 없음 (dev 테스트용, 현재 활성):
#     - HTTP 전용, ALB DNS(k8s-xxx.elb.amazonaws.com) 로 직접 접근
#     - TLS/ACM 인증서 불필요, Route53 불필요
#     - smoke-test / 내부 검증용으로만 사용. 사용자에게 공개 금지(평문 HTTP)
#
# ■ 방식 B — 도메인 있음 (prod, 또는 dev에 도메인 있을 때):
#     - HTTPS + ACM 인증서 + Route53 CNAME 필요
#     - 사전 준비:
#         1) Route53 Hosted Zone 또는 외부 DNS 에 도메인 등록
#         2) ACM 에서 `gateway-dev.<domain>`, `admin-dev.<domain>` 등 인증서 발급·검증
#         3) 아래 방식 A 블록을 주석 처리하고 방식 B 블록의 주석 해제
#         4) certificate-arn 을 실제 값으로 교체
#         5) helm install/upgrade 후 Route53 에 ALB DNS → custom host CNAME 추가
# ============================================================================

# === 방식 A (활성): 도메인 없음, HTTP 전용 ===
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip  # Fargate 필수
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # SSE 스트리밍을 위해 idle timeout 충분히
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
  # host 를 비워두면 ALB 가 모든 Host 헤더를 수락 (ALB DNS 로 직접 접근 가능)
  gateway:
    host: ""
    tls:
      enabled: false
  adminUi:
    host: ""
    tls:
      enabled: false
    # 최종형(고객 권장): admin 을 private 서브넷 internal ALB 로 — 아래 2줄 해제.
    # 전제 S2S VPN. 상세: docs/us-llm-gateway/architecture.md 「고객사 최종 아키텍처」
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internal
  adminApi:
    host: ""
    tls:
      enabled: false
    # 최종형(고객 권장): 위 adminUi 와 동일 — 아래 2줄 해제 (gateway 는 public 유지)
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internal

# === 방식 B (주석): 도메인 있음, HTTPS ===
# 위 "방식 A" 블록 전체(ingress: ... adminApi 까지)를 주석 처리하고 아래 주석을 해제하세요.
#
# ingress:
#   enabled: true
#   className: "alb"
#   annotations:
#     alb.ingress.kubernetes.io/scheme: internet-facing
#     alb.ingress.kubernetes.io/target-type: ip
#     alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
#     alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
#     alb.ingress.kubernetes.io/ssl-redirect: "443"
#     alb.ingress.kubernetes.io/healthcheck-path: /health
#     alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
#     alb.ingress.kubernetes.io/backend-protocol: HTTP
#     alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
#     # 아래 ACM 인증서 ARN 을 실제 값으로 교체하세요.
#     # aws acm list-certificates --region ap-northeast-2 로 확인.
#     alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:ACCOUNT_ID:certificate/CERT_ID"
#   gateway:
#     host: "gateway-dev.llm-gateway.example.com"
#     tls:
#       enabled: true
#   adminUi:
#     host: "admin-dev.llm-gateway.example.com"
#     tls:
#       enabled: true
#   adminApi:
#     host: "admin-api-dev.llm-gateway.example.com"
#     tls:
#       enabled: true

# ----------------------------------------------------------------------------
# Observability — EKS Fargate는 DaemonSet 불가 → sidecar 또는 managed ADOT
# ----------------------------------------------------------------------------
observability:
  otel:
    # Chart 에 sidecar ConfigMap 템플릿 이 아직 없어서 "sidecar" 로 두면 gateway-proxy
    # Pod 가 존재하지 않는 ConfigMap 참조로 ContainerCreating 에서 영구 대기.
    # 당장은 OTel Collector 배포 전이므로 "in-cluster" 로 두고 endpoint 는 dummy.
    # 실제 Collector 배포 시점에 endpoint 만 교체하면 됨 (Pod 재시작 불필요 — env only).
    mode: "in-cluster"
    endpoint: "otel-collector.observability.svc.cluster.local:4317"
    protocol: "grpc"

# ============================================================================
# 서비스별 — dev는 최소 replica (비용 절감)
# ============================================================================
gatewayProxy:
  replicaCount: 1
  # 이미지 태그 명시 — 비우면 Chart.appVersion(1.0.43-rebrand)로 리셋되어 다운그레이드됨.
  # helm --set 없이 helm upgrade 만 해도 이 태그가 유지되도록 각 서비스에 명시(정합 고정).
  # 1.0.49-xacct: claude-code→374 cross-account Bedrock native 코드(BedrockAccountClientProvider
  #   + adapter resolver/859 투명폴백).
  # 1.0.50-xacct-review: 어드버서리 리뷰 픽스 — 캐시키에 external_id 포함(#1, stale 재사용 방지),
  #   count_tokens 도 cross-account(#4, invoke=374/count=859 스플릿 제거), _region_for_rewrite
  #   명시 초기화(#6, locals() 리플렉션 제거). 무회귀(269 유닛 통과).
  # 1.0.51-resilience: 6축 견고성 갭 4건 — readiness 전용 /health/ready(DB_DEGRADED/풀 hard_cap
  #   소진 시 503), pool_timeout=10·pool_recycle=3600, bedrock retries 배선(기본1), event_detector
  #   LRU bounded. 283 유닛 통과. ⚠️ readinessProbe.path 아래 gatewayProxy 프로브 참조.
  image:
    # 1.0.52-workers: Dockerfile CMD 를 shell-form ${WORKERS:-4} 로 수정 → chart 의 WORKERS
    #   env 가 살아남(이전엔 --workers 4 하드코딩이라 죽은 설정). 0.5 vCPU 워커 기아 해소.
    # 1.0.53-streamfix: stream_idle_timeout / stream_disconnect_drain_timeout 이 config 에만
    #   있고 streaming.py 에 배선되지 않아 죽은 설정이던 것을 연결 + 타임아웃·예외 경로에서
    #   usage/billing 이 유실되던 것을 usage_fired 멱등 가드로 수정(A-1). 330 유닛 통과.
    # 1.0.54-phase2gw: 1.0.53 이후 레포 HEAD 에 쌓여 있던 gateway-proxy 미배포분 6파일을
    #   반영 — thinking_normalizer / tool_filter 신규 2, mantle_adapter ·
    #   mantle_openai_adapter · web_search_loop 수정 3, agentcore_mcp_client 의 MCP
    #   clientInfo de-brand 1. 이미지 내부 소스 77/77 이 HEAD 와 md5 완전일치 검증,
    #   unit 369 통과(integration 실패 10 은 로컬 Postgres 부재로 변경 전과 동일).
    # 1.0.55-runtimeplane: GPT-5.6 을 표준 bedrock-runtime plane 으로도 서비스
    #   (bedrock_openai_adapter + sigv4_signer 신규, provider enum 미러 확장) +
    #   OpenAI 방언 캐시 이중과금 정정(split_openai_input 3버킷: 순입력/cache read/cache write).
    #   ⚠️ 이 이미지는 provider enum 에 BEDROCK_RUNTIME_OPENAI 가 있어야 모델 조회가 되므로
    #   migration(0031) **보다 먼저** 올려야 한다 — 미러에 없는 enum 라벨을 DB 에서 읽으면
    #   READ 에서 죽어 카탈로그 전체가 깨진다. 순서: 앱 먼저 → migration 나중.
    #   578 유닛/회귀 통과 + 실 PG16 0001→0033 완주 후 DB 통합 4/4.
    # 1.0.56-wsresiduals: web search 루프 잔여 결함 3건 수정(upstream fix/websearch-residuals 4261967 cherry-pick)
    #   — 검색+클라이언트 도구 동시 호출 턴에서 클라이언트 도구 호출 삼킴 · 응답에 web_search tool_use 누출
    #   (다음 턴 Bedrock "Tool web_search not found" 400) · message_start 없는 종료 프레임. 2026-09-15 US Cowork 실측.
    # 1.0.57-wsdesc: web_search 도구 설명에 절제 지시(한 사실당 검색 1회·재검색 금지·결과 상한 고지) 추가.
    # 1.0.58-wsfinal: force_final 턴 400 수정 — 이력에 새어 있던 web_search 블록을 이름으로 걷어내고,
    #   비스트리밍 루프 2개도 force_final 에서 걷어낸다(2026-09-16 실측: 상한을 낮추자 Cowork 재시도 3회가 전부 400).
    # 1.0.59-outcfg: Cowork 의 output_config.format(구조화 출력)을 Bedrock 이 거부(400) → effort 만 남기고 걷어냄.
    # 1.0.60-ctxusage: 클라이언트 usage 의 입력·캐시 버킷을 검색 N턴 합계가 아니라 첫 턴 값으로 → Cowork 자동 압축 thrashing 해소(청구는 불변).
    tag: "1.0.60-ctxusage"
  serviceAccount:
    annotations:
      # CHANGE_ME (terraform output): IRSA role ARN. terraform output -raw gateway_proxy_role_arn
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/llm-gateway-dev-gateway-proxy-bedrock"
  env:
    # uvicorn 워커 수. Dockerfile CMD 가 ${WORKERS:-4} 로 읽음(1.0.98+). Fargate cpu
    # request 250m(≈0.25 vCPU)에서 워커당 CPU 기아를 피하려 2 로 명시(과거엔 Dockerfile
    # 하드코딩 4 라 이 값이 죽은 설정이었음). rate-limit divisor(uvicorn_workers)와 정합.
    WORKERS: "2"
    # Server-side web search (Architecture C, AgentCore Gateway). AGENTCORE_GATEWAY_URL is
    # the managed WebSearch gateway's /mcp endpoint (us-east-1); until it's provisioned and
    # set here, agentcore_mcp_client is None → the router branch is skipped (zero-regression).
    # AGENTCORE_REGION differs from aws.region (ap-northeast-2) on purpose — WebSearch is
    # us-east-1-only; SigV4 signs to us-east-1 while the pod stays in Seoul.
    # ⚠️ 이 값은 배포마다 다르다 — AgentCore 가 게이트웨이 이름 뒤에 무작위 접미사를
    #    붙여 발급하므로, 아래 xxx 자리를 자기 계정의 실제 게이트웨이 id 로 바꿔야 한다
    #    (deployment/scripts/provision_agentcore_websearch.py 가 출력한다).
    #    비워 두면 agentcore_mcp_client 가 None 이 되어 라우터 분기를 건너뛴다(무회귀).
    AGENTCORE_GATEWAY_URL: "https://gw-websearch-xxx.gateway.bedrock-agentcore.us-east-1.amazonaws.com/mcp"
    AGENTCORE_REGION: "us-east-1"
    AGENTCORE_TARGET_ID: "web-search-tool"
    WEB_SEARCH_ENABLED: "true"   # global kill-switch; per-client gating via routing_profiles.web_search_enabled
  # SSE 스트리밍 타임아웃. dev ALB idle_timeout=300s(:118) 보다 60s 아래로 둔다 —
  # 같거나 크면 ALB 가 먼저 끊어 클라이언트가 truncated stream 을 본다.
  # ALB 값을 바꾸면 이 값도 함께 조정할 것.
  streaming:
    idleTimeout: 240
    disconnectDrainTimeout: 30
  resources:
    requests:
      cpu: "250m"  # Fargate 하한
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  podDisruptionBudget:
    enabled: false

adminApi:
  replicaCount: 1
  image:
    # 1.0.65-kstfix: KST 기간 필터 non-sargable 제거(함수를 컬럼에서 떼고 경계값을 UTC 로
    #   미리 계산 → idx_usage_logs_requested_at 사용, 86.7ms→7.9ms) + 생산성/Git 지표가
    #   UTC 로 비닝되어 비용(KST)과 하루씩 어긋나던 것 통일(A-2/E-1). 회귀 대조: 신규 0.
    # 1.0.66-kstdefault: 위 E-1 의 **잔존 4곳** 수정 — my/budget·my/usage·
    #   analytics/models·budgets/team allocation 이 여전히 date.today()(=pod TZ UTC)로
    #   기본 period 를 정해, 매월 1일 KST 00~09시 9시간 동안만 지난달 지표가 보였다.
    #   기본 period 를 current_kst_period() 한 곳으로 모음(dashboard 포함 5개 라우터).
    #   + period 형식 오류를 조용한 0건/500 이 아니라 **400** 으로(ValidationError).
    #   회귀 대조: 신규 0 (24 실패는 baseline 과 동일한 기존 fixture 이슈).
    # 1.0.67-roifix: ⚠️ 1.0.66 의 **스케줄러 회귀 수정** — 반드시 올릴 것.
    #   1.0.66 은 roi_aggregator 의 kst_period_range_filter import 를 aggregate_usage()
    #   **안**에 뒀는데 호출은 _aggregate_productivity() 에도 있어, 함수 로컬 바인딩이
    #   형제 함수까지 미치지 않아 `NameError` 로 ROI 집계가 15분마다 전부 실패했다
    #   (dev 31회/prod 도 동일 실측). API 는 정상이라 화면 증상이 없고 ROI 만 갱신 정지 —
    #   기존 가드 테스트가 소스를 **문자열 grep** 해서 통과해 버린 것이 유출 원인이다.
    #   → import 를 모듈 최상단으로, 가드를 "호출 지점에서 이름이 해석되나"(AST 스코프)로 교체.
    #   함께: (a) period='26-08'/'2026-8' 이 자리수 미검증으로 통과해 **200 + 전부 0** 이던 것,
    #   (b) '9999-12' 가 맨 ValueError 로 **500** 이던 것을 정규식+연범위로 400 통일(prod 실측).
    #   (c) E-1 잔존 2곳 — scheduler/main.py(ROI 행을 실제로 **쓰는** cron)와 internal.py 가
    #       UTC 월(`datetime.now(timezone.utc).strftime`)이라, 읽는 쪽만 KST 로 고친 상태에서는
    #       매월 1일 KST 00~09시에 새 달 행이 생성되지 않아 지표가 0 으로 보였다.
    #   전 항목 음성대조군으로 검증(수정 되돌리면 정확히 그 테스트만 실패). 회귀 대조: 신규 0.
    # 1.0.68-invlogaudit: Bedrock invocation log 본문 감사 API
    #   (/admin/audit/invocation-log/{config,reconcile,{bedrock_request_id}}) + provider enum
    #   미러 확장 + usage_logs 컬럼 미러 드리프트 수정. 아래 BEDROCK_INVOCATION_LOG_* 가
    #   비어 있으면 감사 엔드포인트는 404 가 아니라 **503**(미설정)을 준다 — 지금 dev 의 상태다
    #   (terraform 의 enable_bedrock_invocation_logging 이 false 라 log group 이 없다).
    #   285 통과. ⚠️ scheduler.image.tag 를 같은 값으로 유지(아래 주석 참조).
    tag: "1.0.68-invlogaudit"
  serviceAccount:
    annotations:
      # CHANGE_ME (terraform output): IRSA role ARN. terraform output -raw admin_api_role_arn
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/llm-gateway-dev-admin-api"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1500m"
      memory: "1Gi"
  autoscaling:
    enabled: false
  env:
    # DEV_LOGIN_ENABLED 는 global.devLoginEnabled (이 파일 상단) 로 주입됨.
    # CHANGE_ME (terraform output): Cognito User Pool ID. terraform output -raw cognito_user_pool_id
    COGNITO_USER_POOL_ID: "ap-northeast-2_nKW7FJWst"
    COGNITO_REGION: "ap-northeast-2"
    COGNITO_SYNC_DEACTIVATE_MISSING: "true"
    # BI Insight / 퀵챗 = AgentCore Runtime(admin-chat-agent) 연결. 이 ARN 없으면
    # chat_agent.py:333 이 503 "AgentCore runtime not configured" 반환.
    # values 에 명시(--set 유실 방지). ARN = aws bedrock-agentcore-control list-agent-runtimes.
    AGENTCORE_REGION: "ap-northeast-2"
    AGENTCORE_RUNTIME_ARN: "arn:aws:bedrock-agentcore:ap-northeast-2:123456789012:runtime/llm_gateway_dev_admin_chat_agent-a8AdBh8WM8"
    # 리포트 다운로드 presign 라우트도 같은 버킷의 reports/ prefix 를 쓴다.
    # IRSA role(llm-gateway-dev-admin-api)에 report-download-presign 정책 부여됨(§49).

    # ── Bedrock invocation log 감사 대조 (/admin/audit/invocation-log/*) ──
    # 요청/응답 **본문**까지 남는 유일한 경로다(GPT-5.6 표준 runtime plane). 채우면 감사
    # 엔드포인트가 살아나고, 비우면 503(미설정)을 반환한다 — 404 가 아니므로 UI 가
    # "기능 없음" 과 "안 켬" 을 구분할 수 있다. 라우터는 항상 등록된다.
    #
    # 값의 출처: cd deployment/terraform/environments/llm-gateway-dev &&
    #   tofu output -raw bedrock_invocation_log_group
    #   tofu output -raw bedrock_invocation_log_region
    # (또는 deployment/scripts/provision_bedrock_invocation_logging.py deploy 의 출력)
    #
    # ⚠️ REGION 은 배포 리전(ap-northeast-2)이 아니라 **모델이 실행된 리전**이다. GPT-5.6
    #    runtime plane 은 us-east-2 에서 실행되므로 로그도 거기 쌓인다. 서울로 조회하면
    #    로그가 0건이어서 대조 리포트가 과금 행 전부를 `missing` 으로 표시한다.
    # ⚠️ 이 스위치는 **리전 단위로 계정 전체**의 본문을 수집한다(모델·principal 단위 스코프
    #    없음). 그래서 install-eks.sh 가 자동 주입하지 않고, 여기 비워 둔 채로 시작한다.
    #    dev 에서 라이브 캡처 검증을 끝낸 뒤 로깅 구성을 지웠으므로 현재는 미설정 상태다.
    #    다시 켤 때: terraform 은 enable_bedrock_invocation_logging=true 로 apply.
    BEDROCK_INVOCATION_LOG_GROUP: ""
    BEDROCK_INVOCATION_LOG_REGION: "us-east-2"
    # 본문(프롬프트 원문) 열람 게이트. true 로 켜면 조회마다 audit_logs 에
    # VIEW_INVOCATION_LOG_BODY 가 남는다. 승인 없이 켜지 말 것.
    BEDROCK_INVOCATION_LOG_BODIES_ENABLED: "false"

  # ── OIDC (Cognito) ──
  # issuerUrl / providerName 은 install-eks.sh 가 terraform output 에서 자동 주입.
  # 수동 helm install 시엔 --set adminApi.oidc.issuerUrl=... 로 override.
  oidc:
    enabled: true
    # CHANGE_ME (terraform output): cognito_issuer_url. 형식 https://cognito-idp.{region}.amazonaws.com/{pool_id}
    issuerUrl: "https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_nKW7FJWst"
    audience: ""               # Cognito access_token 은 aud 없음 → 비워둠
    providerName: "oidc:cognito"
    groupsClaim: "cognito:groups"
    groupPrefix: "Claude_"
    rejectUnmatchedGroups: true
    requiredGroup: ""
    vkTtlHours: 1

  adminBootstrap:
    # CHANGE_ME (org-specific): 첫 운영자 이메일. 이 사용자가 ClaudeAdmin 으로 승격됨
    emails:
      - "admin@example.com"
    groups:
      - "ClaudeAdmin"

  # admin-ui 커스텀 로그인 폼(Cognito ROPC). 비활성 상태로 두면(빈 값) admin-ui 는
  # devLoginEnabled 로만 로그인 가능 — 활성화하려면 아래 CHANGE_ME 를 채우고
  # auth.adminUiJwt.privateKeySecretName 도 함께 설정할 것 (03-secrets.md 참고).
  adminUiLogin:
    # CHANGE_ME (terraform output): terraform output -raw cognito_client_id
    cognitoAppClientId: ""

adminUi:
  replicaCount: 1
  image:
    # 1.0.99-modelform: ModelCreateSchema 에서 max_tokens/context_window 를 제거 — 폼에
    #   입력란이 없고 백엔드·DB 에도 대응 필드가 없어 required 로 남으면 safeParse 가 항상
    #   실패, 모델 등록/편집이 100% 막히던 것 수정(브랜드 1.0.97·modelfix 1.0.98 포함).
    # 1.0.100-mwredirect: 미들웨어 로그인 리다이렉트가 상대 Location 이라 Next 14.2 어댑터에서
    #   Invalid URL → 미인증·만료 요청이 오는 모든 페이지 500 (upstream b51fab0 를 처음 빌드한 결과).
    #   요청 Host + x-forwarded-proto 로 절대 URL 을 만들도록 수정.
    tag: "1.0.100-mwredirect"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: false

scheduler:
  image:
    # admin-api 이미지 공유 — adminApi.image.tag 와 **항상 같은 값**으로 유지한다.
    # roi_aggregator 가 KST 비닝 수정(A-2/E-1)의 대상이라 어긋나면 스케줄러만 옛 로직으로 집계.
    # ⚠️ 이 값이 특히 중요하다: 1.0.67-roifix 가 고친 NameError 는 **스케줄러에서만** 터진다
    # (API 경로는 그 함수를 안 탄다). adminApi 만 올리고 여기를 두면 ROI 집계는 계속 실패한다.
    tag: "1.0.68-invlogaudit"
  resources:
    requests:
      cpu: "250m"  # Fargate 하한
      memory: "512Mi"

notificationWorker:
  replicaCount: 1
  # 1.0.44-phase2: upstream 9203164 동기화 — notification-worker 코드 4커밋(+1,907줄)이 들어와
  #   새 태그로 빌드한다. 같은 태그로 rebuild 하면 매니페스트가 안 바뀌어 롤아웃이 없고 옛 이미지만 덮인다.
  image:
    tag: "1.0.44-phase2"
  serviceAccount:
    annotations: {}
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
  autoscaling:
    enabled: false
  email:
    provider: "mock"          # 고객 내부 메일 API 연동 시 "internal_api"로 전환
    internalApi:
      url: ""                 # 고객 내부 메일 API URL
      fromAddress: "no-reply-dev@llm-gateway.local"
      fromName: "LLM Gateway"

# DB migration hook — 태그 명시(비우면 Chart.appVersion=1.0.43-rebrand 로 리셋되는데,
# 그 이미지는 revision 0021 을 모름 → `alembic upgrade head` 가 DB 현재 리비전(0021)을
# 못 찾아 pre-upgrade 훅 실패).
# 1.0.49-xacct: head=0022(claude-code→374 cross-account). upgrade head 가 0021→0022 적용
#   = routing_profiles.claude-code account_role_arn 을 374 role 로 SET → 374 컷오버.
#   즉시 롤백: 0022 downgrade(account_role_arn NULL) 또는 SQL UPDATE + Redis 플러시.
# 1.0.50-models: head=0028. 0022→0028 을 적용한다 —
#   0023(예산 partial unique index) / 0024(활성 config 중복 제거 + 부분 유니크 인덱스) /
#   0025(GPT-5.6 sol·luna·terra alias) / 0026(usage_logs.requested_at 인덱스) /
#   0027(Claude 5 opus/sonnet alias) / 0028(codex default_model → codex-gpt-5.6-terra).
#   ⚠️ 0024 의 중복 제거는 **비가역**(downgrade 는 인덱스만 drop). 적용 전 dev/prod 양쪽에서
#   활성 중복을 셌고 둘 다 0 건이라 실제로 비활성화되는 행은 없음(2026-08-20 실측).
#   ⚠️ 0028 적용 후 codex 라우팅 캐시를 비워야 반영: `DEL routing_profile:codex` (또는 TTL 300s 대기).
#   ⚠️ 0027 의 alias 만으로는 호출이 안 된다 — IAM 의 foundation-model 패턴도 함께 필요
#   (Claude 5 는 prod/dev 정책 v2 에 anthropic.claude-{opus,sonnet}-5* 추가 완료).
#   또한 run_migration.sh 의 SCHEMAS 에 chat_agent 가 이 이미지부터 포함(A-3).
# 1.0.52-head0033: head=0033. 0029→0033 을 적용한다 —
#   0029(OPENMODEL 샘플 alias llama-3-70b · endpoint_url NULL 이라 보이지만 호출 불가) /
#   0030(Claude Sonnet 5 단가 1.5배 과대 정정) / 0031(provider enum BEDROCK_RUNTIME_OPENAI) /
#   0032(표준 plane alias gpt-5.6-{sol,terra,luna} + backend CHECK 확장) /
#   0033(codex-gpt-5.6-sol 단가 공시 컷 정정).
#   ⚠️ **배포 순서가 강제된다**: 이 차트에서 migration 은 pre-upgrade **훅**(weight -5)이라
#   앱 파드보다 **먼저** 돈다. 그래서 앱을 먼저 올리는 별도 upgrade 를 한 번 돌린 뒤
#   (rev 86: gateway-proxy 1.0.55 / admin-api·scheduler 1.0.68) 이 태그를 올려야 한다.
#   한 번에 올리면 0032 가 심은 BEDROCK_RUNTIME_OPENAI 행을 그 enum 라벨이 없는 구버전
#   파드가 읽어 **모델 카탈로그 조회 전체가 READ 에서 죽는다**.
#   ⚠️ 적용 후 Redis 플러시 필수: `model:*` / `model:list` (TTL 300s 대기도 가능).
#   ⚠️ 0030/0033 은 운영자 개입 가드가 있어 admin UI 로 단가를 이미 바꾼 환경에서는 no-op.
migration:
  image:
    tag: "1.0.52-head0033"

costRecorderWorker:
  replicaCount: 1
  # 1.0.48-replayfix: cost-recorder 이중 차감(커밋~XACK 사이 파드 사망 시 budget_usages 재가산) ·
