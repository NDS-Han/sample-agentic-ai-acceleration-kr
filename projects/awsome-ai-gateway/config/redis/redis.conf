# Redis 설정 — LLM Gateway (개발 환경)
maxmemory 256mb
# allkeys-lru — 이 인스턴스는 캐시 전용(save ""/no AOF). volatile-lru 는 TTL 이 있는
# 키만 퇴거하므로 TTL 없는 키가 하나라도 쌓이면 maxmemory 에 도달해도 퇴거되지 않고
# 쓰기가 OOM 거부된다.
maxmemory-policy allkeys-lru
lua-time-limit 1000
# RDB/AOF 비활성 (캐시 전용)
save ""
appendonly no
# 연결 설정
tcp-keepalive 300
timeout 0
