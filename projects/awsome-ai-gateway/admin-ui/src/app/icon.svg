<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 브라우저 탭 favicon — components/brand/BrandLogo.tsx 와 같은 그래프 노드 마크.
       탭 바는 앱 테마가 아니라 브라우저/OS 테마를 따르므로 prefers-color-scheme 로 칠한다.
       16px 에서도 보이도록 BrandLogo 보다 노드·엣지를 조금 굵게. -->
  <style>
    .e{stroke:#0f766e}.a{fill:#0f766e}.b{fill:#0d9488}.c{fill:#14b8a6}
    @media (prefers-color-scheme: dark){.e{stroke:#2dd4bf}.a{fill:#2dd4bf}.b{fill:#5eead4}.c{fill:#14b8a6}}
  </style>
  <path class="e" d="M9 21 L22 10 L24 23 Z" fill="none" stroke-width="2.2" stroke-linejoin="round"/>
  <circle class="a" cx="9" cy="21" r="4"/>
  <circle class="b" cx="22" cy="10" r="4"/>
  <circle class="c" cx="24" cy="23" r="3.4"/>
</svg>
