<h2>모델 다운그레이드 안내</h2>
<p>안녕하세요, {{ recipient_name }}님.</p>
<p>예산 사용량 증가로 인해 요청하신 모델이 아래와 같이 변경되었습니다.</p>
<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;">
  <tr>
    <td><strong>항목</strong></td>
    <td><strong>값</strong></td>
  </tr>
  <tr>
    <td>기존 모델</td>
    <td>{{ payload.from_model | default('') }}</td>
  </tr>
  <tr>
    <td>변경된 모델</td>
    <td>{{ payload.to_model | default('') }}</td>
  </tr>
  <tr>
    <td>예산 임계치</td>
    <td>{{ payload.threshold_pct | default('') }}%</td>
  </tr>
</table>
<p>자세한 사항은 관리자에게 문의하세요.</p>
<p><small>{{ gateway_name }} — {{ timestamp_kr }}</small></p>
