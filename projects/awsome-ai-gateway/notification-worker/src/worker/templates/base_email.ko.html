<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>{% block title %}{% endblock %} | LLM Gateway</title>
</head>
<body style='margin:0; padding:0; background-color:#0c0d0f;'>
  <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='width:100%; background-color:#0c0d0f; padding:32px 16px;'>
    <tr>
      <td align='center' style='padding:0;'>
        <table role='presentation' width='600' cellpadding='0' cellspacing='0' border='0' style='width:100%; max-width:600px; background-color:#111214; border:1px solid #202126; border-radius:16px; overflow:hidden;'>
          <tr>
            <td style='padding:32px 28px;'>
              <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='width:100%;'>
                <tr>
                  <td style='padding-bottom:20px; border-bottom:1px solid #202126;'>
                    <h1 style='margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:20px; font-weight:600; color:#2dd4bf; line-height:1.3;'>LLM Gateway</h1>
                  </td>
                </tr>
                <tr>
                  <td style='padding-top:20px;'>
                    <p style='margin:0 0 24px 0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.6; color:#f4f5f6;'>안녕하세요, {{ recipient_name }}님.</p>
                    {% block body %}{% endblock %}
                  </td>
                </tr>
                <tr>
                  <td style='padding-top:24px; border-top:1px solid #202126;'>
                    <p style='margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#9a9fa8;'>{{ gateway_name }} &mdash; {{ timestamp_kr }}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
