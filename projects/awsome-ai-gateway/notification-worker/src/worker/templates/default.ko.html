{% extends 'base_email.ko.html' %}
{% block title %}이벤트 알림{% endblock %}
{% block body %}
<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='width:100%;'>
  <tr>
    <td style='padding-bottom:8px;'>
      <h2 style='margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:18px; font-weight:600; color:#2dd4bf; line-height:1.4;'>이벤트 알림</h2>
    </td>
  </tr>
  <tr>
    <td style='padding-bottom:16px;'>
      <p style='margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6; color:#f4f5f6;'>LLM Gateway에서 새로운 알림이 발생했습니다.</p>
    </td>
  </tr>
  <tr>
    <td style='padding-top:16px; border-top:1px solid #202126;'>
      <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='width:100%; border-collapse:collapse;'>
        <tr style='background-color:#0c0d0f;'>
          <th style='padding:10px 8px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; color:#2dd4bf; text-align:left; border-bottom:1px solid #202126;'>키</th>
          <th style='padding:10px 8px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; color:#2dd4bf; text-align:left; border-bottom:1px solid #202126;'>값</th>
        </tr>
        {% for key, value in payload.items() %}
        <tr>
          <td style='padding:10px 8px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:14px; color:#9a9fa8; border-bottom:1px solid #202126; vertical-align:top;'>{{ key }}</td>
          <td style='padding:10px 8px; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:14px; color:#f4f5f6; border-bottom:1px solid #202126; vertical-align:top;'>{{ value }}</td>
        </tr>
        {% endfor %}
      </table>
    </td>
  </tr>
</table>
{% endblock %}
